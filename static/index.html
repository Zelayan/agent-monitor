<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENT MONITOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'ui-monospace', 'monospace'],
          },
          colors: {
            canvas: '#09090b',
            panel: '#0c0d0e',
            card: '#111215',
            line: '#27272a',
          },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: dark; }
    body { background: #09090b; }
    .lane { max-height: calc(100vh - 8.75rem); }
    .task-card { transition: border-color 0.12s ease; }
    .task-card:hover { border-color: #3f3f46; }
    .overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .drawer.open { transform: translateX(0); }
    .filter-pill[aria-pressed="true"] {
      background: #18181b;
      border-color: #3f3f46;
      color: #e4e4e7;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    input[type="search"]::-webkit-search-cancel-button { display: none; }
  </style>
</head>
<body class="min-h-screen text-zinc-200 font-sans antialiased">
  <header class="sticky top-0 z-30 border-b border-line bg-panel">
    <div class="max-w-[1440px] mx-auto px-4 py-2.5 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="font-mono text-[12px] text-zinc-400 leading-none select-none">&gt;_</span>
        <span class="text-[11px] font-semibold tracking-[0.16em] text-zinc-100">AGENT MONITOR</span>
        <span id="daemon-status" class="inline-flex items-center gap-1.5 font-mono text-[11px] tabular-nums text-zinc-500">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6b8f71]"></span>
          127.0.0.1:8000
        </span>
      </div>

      <div class="flex items-center gap-3 font-mono text-[11px] tabular-nums">
        <span class="text-amber-500"><span id="lbl-stat-running" class="uppercase tracking-wide">运行中:</span> <span id="stat-running">0</span></span>
        <span class="text-zinc-200"><span id="lbl-stat-completed" class="uppercase tracking-wide">已完成:</span> <span id="stat-completed">0</span></span>
        <span class="text-zinc-500"><span id="lbl-stat-avg" class="uppercase tracking-wide">平均耗时:</span> <span id="stat-avg">00m 00s</span></span>
      </div>

      <div class="flex items-center gap-2 flex-1 min-w-[240px] justify-end">
        <label class="relative flex-1 max-w-xs">
          <span class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-zinc-600">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          </span>
          <input id="search-input" type="search" placeholder="筛选会话"
            class="w-full h-7 pl-7 pr-11 rounded bg-card border border-line text-[12px] text-zinc-200 placeholder:text-zinc-600 outline-none focus:border-zinc-500">
          <kbd class="pointer-events-none absolute right-1.5 top-1/2 -translate-y-1/2 font-mono text-[10px] text-zinc-600 border border-line rounded px-1 py-px">⌘K</kbd>
        </label>
        <div id="agent-filters" class="flex items-center gap-1 flex-wrap" role="group" aria-label="Agent filter"></div>
        <button id="btn-lang" type="button" class="h-7 px-2 rounded border border-line bg-card font-mono text-[11px] text-zinc-400 hover:border-zinc-500 hover:text-zinc-200" title="Switch Language / 切换语言">
          EN
        </button>
        <button id="btn-mock" type="button" class="h-7 px-2.5 rounded bg-zinc-100 text-zinc-950 text-[11px] font-medium hover:bg-white">
          + 模拟上报
        </button>
        <button id="btn-clear" type="button" class="h-7 px-2.5 rounded border border-line bg-transparent text-[11px] text-zinc-400 hover:border-zinc-500 hover:text-zinc-200">
          清空
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1440px] mx-auto px-4 py-3">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
      <section class="min-w-0">
        <h2 class="h-7 flex items-center justify-between border-b border-line mb-2">
          <span class="inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.14em] text-zinc-300">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0"></span>
            <span id="header-running">运行中</span>
          </span>
          <span id="count-running" class="font-mono text-[11px] tabular-nums text-zinc-500">0</span>
        </h2>
        <div id="col-running" class="lane overflow-y-auto space-y-2 pr-0.5"></div>
      </section>
      <section class="min-w-0">
        <h2 class="h-7 flex items-center justify-between border-b border-line mb-2">
          <span class="inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.14em] text-zinc-300">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7"/></svg>
            <span id="header-completed">已完成</span>
          </span>
          <span id="count-completed" class="font-mono text-[11px] tabular-nums text-zinc-500">0</span>
        </h2>
        <div id="col-completed" class="lane overflow-y-auto space-y-2 pr-0.5"></div>
      </section>
      <section class="min-w-0">
        <h2 class="h-7 flex items-center justify-between border-b border-line mb-2">
          <span class="inline-flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.14em] text-zinc-300">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5"/><path d="M12 16.2h.01"/></svg>
            <span id="header-failed">失败 / 中断</span>
          </span>
          <span id="count-failed" class="font-mono text-[11px] tabular-nums text-zinc-500">0</span>
        </h2>
        <div id="col-failed" class="lane overflow-y-auto space-y-2 pr-0.5"></div>
      </section>
    </div>
  </main>

  <div id="drawer-overlay" class="overlay fixed inset-0 z-40 bg-black/50"></div>
  <aside id="drawer" class="drawer fixed top-0 right-0 z-50 h-full w-full max-w-[400px] bg-panel border-l border-line flex flex-col" aria-hidden="true">
    <div class="flex items-start justify-between gap-2 px-3 py-3 border-b border-line">
      <div class="min-w-0">
        <div id="drawer-id" class="font-mono text-[11px] tabular-nums text-zinc-400"></div>
        <div class="mt-1.5 flex flex-wrap items-center gap-2">
          <span id="drawer-agent"></span>
          <span id="drawer-repo" class="font-mono text-[11px] tabular-nums text-zinc-500"></span>
        </div>
      </div>
      <button id="drawer-close" type="button" class="shrink-0 w-7 h-7 rounded border border-line text-zinc-500 hover:text-zinc-200 hover:border-zinc-500 inline-flex items-center justify-center" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-3 py-3 space-y-4">
      <section>
        <h3 id="drawer-prompt-title" class="font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-500 mb-1.5">用户 Prompt</h3>
        <p id="drawer-prompt" class="text-[13px] leading-relaxed text-zinc-200 whitespace-pre-wrap"></p>
      </section>
      <section>
        <h3 id="drawer-trace-title" class="font-mono text-[10px] uppercase tracking-[0.16em] text-zinc-500 mb-2">生命周期 Hook 时间线</h3>
        <ol id="drawer-timeline" class="relative"></ol>
      </section>
    </div>
    <div id="drawer-metrics" class="grid grid-cols-3 gap-px bg-line border-t border-line text-center"></div>
  </aside>

  <script>
    const I18N = {
      zh: {
        htmlLang: 'zh-CN',
        langBtn: 'EN',
        statRunning: '运行中:',
        statCompleted: '已完成:',
        statAvg: '平均耗时:',
        searchPlaceholder: '筛选会话',
        btnMock: '+ 模拟上报',
        btnClear: '清空',
        headerRunning: '运行中',
        headerCompleted: '已完成',
        headerFailed: '失败 / 中断',
        drawerPrompt: '用户 Prompt',
        drawerTrace: '生命周期 Hook 时间线',
        drawerDuration: '耗时',
        drawerHooks: '事件数',
        drawerStatus: '状态',
        statusRunning: '运行中',
        statusCompleted: '已完成',
        statusFailed: '已失败',
        noRunning: '暂无运行中的会话',
        noCompleted: '暂无已完成的会话',
        noFailed: '暂无失败会话',
        noPrompt: '(无 Prompt 描述)',
        noTimeline: '暂无 Hook 轨迹',
        offline: '离线',
        filterAll: '全部',
        abortedDefault: '用户终止执行 (SIGINT)',
      },
      en: {
        htmlLang: 'en',
        langBtn: '中文',
        statRunning: 'ACTIVE:',
        statCompleted: 'DONE:',
        statAvg: 'AVG_DUR:',
        searchPlaceholder: 'Filter sessions',
        btnMock: '+ Dispatch Mock',
        btnClear: 'Clear',
        headerRunning: 'Running',
        headerCompleted: 'Completed',
        headerFailed: 'Failed / Aborted',
        drawerPrompt: 'Prompt',
        drawerTrace: 'Lifecycle Hook Trace',
        drawerDuration: 'Duration',
        drawerHooks: 'Hooks',
        drawerStatus: 'Status',
        statusRunning: 'RUNNING',
        statusCompleted: 'COMPLETED',
        statusFailed: 'FAILED',
        noRunning: 'No active sessions',
        noCompleted: 'No completed sessions',
        noFailed: 'No failed sessions',
        noPrompt: '(no prompt)',
        noTimeline: 'No hook events',
        offline: 'offline',
        filterAll: 'ALL',
        abortedDefault: 'Aborted by user (SIGINT)',
      },
    };

    let currentLang = localStorage.getItem('agent_monitor_lang') || 'zh';

    const tasksMap = new Map();
    let query = '';
    let agentFilter = 'all';
    let selectedId = null;
    let eventSource = null;
    let reconnectTimer = null;
    let mockSeq = 0;
    let isOnline = true;

    const ICO_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7"/></svg>';

    const MOCKS = [
      {
        agent: 'ZCode',
        repo: 'agent-monitor:master',
        title: '支持生命周期 Hook 实时上报',
        prompt: '在 ZCode 中接入生命周期 Hook 监视。\n上报首条 Prompt、工具调用与会话完结状态。',
        detail: 'scripts/reporter.py',
        event: 'afterFileEdit',
        finish: 'running',
      },
      {
        agent: 'codex-cli',
        repo: 'payments:feat/jwt',
        title: 'Add JWT auth to the payment service',
        prompt: 'Add JWT auth to the payment service.\nCover refresh-token rotation and middleware on /v1/charges.',
        detail: 'src/auth/jwt.go',
        event: 'afterFileEdit',
        finish: 'running',
      },
      {
        agent: 'Cursor Agent',
        repo: 'agent-monitor:main',
        title: 'Tighten the session monitor layout',
        prompt: 'Rewrite the kanban as a compact Agent Session Monitor.\nNo emoji. Inspector drawer for hook traces.',
        detail: 'static/index.html',
        event: 'afterFileEdit',
        finish: 'complete',
      },
      {
        agent: 'claude-code',
        repo: 'infra-tf:fix/sg',
        title: 'Restrict SSH security group to bastion',
        prompt: 'Restrict the production SSH security group to the bastion CIDR only.',
        detail: 'terraform apply -auto-approve',
        event: 'beforeShellExecution',
        finish: 'fail',
      },
    ];

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || key;
    }

    function applyLanguageUI() {
      document.documentElement.lang = t('htmlLang');
      document.getElementById('lbl-stat-running').textContent = t('statRunning');
      document.getElementById('lbl-stat-completed').textContent = t('statCompleted');
      document.getElementById('lbl-stat-avg').textContent = t('statAvg');
      document.getElementById('search-input').placeholder = t('searchPlaceholder');
      document.getElementById('btn-lang').textContent = t('langBtn');
      document.getElementById('btn-mock').textContent = t('btnMock');
      document.getElementById('btn-clear').textContent = t('btnClear');
      document.getElementById('header-running').textContent = t('headerRunning');
      document.getElementById('header-completed').textContent = t('headerCompleted');
      document.getElementById('header-failed').textContent = t('headerFailed');
      document.getElementById('drawer-prompt-title').textContent = t('drawerPrompt');
      document.getElementById('drawer-trace-title').textContent = t('drawerTrace');
      setDaemon(isOnline);
      lastFilterSignature = '';
      render();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('agent_monitor_lang', currentLang);
      applyLanguageUI();
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function agentSlug(name) {
      const raw = String(name || '').trim() || 'agent';
      return raw.toLowerCase().replace(/\s+/g, '-');
    }

    function agentBadge(name) {
      return `<span class="inline-flex items-center px-1 py-px rounded border border-line bg-[#16171a] font-mono text-[10px] text-zinc-300">[${esc(agentSlug(name))}]</span>`;
    }

    function formatDurLong(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}m ${String(s % 60).padStart(2, '0')}s`;
    }

    function durationMs(tObj) {
      if (tObj.endTime && tObj.startTime) return Math.max(0, tObj.endTime - tObj.startTime);
      if (tObj.duration) {
        const m = String(tObj.duration).match(/(\d+)\s*m.*?(\d+)\s*s/i);
        if (m) return (Number(m[1]) * 60 + Number(m[2])) * 1000;
      }
      if (tObj.status === 'running' && tObj.startTime) return Date.now() - tObj.startTime;
      return 0;
    }

    function repoLabel(tObj) {
      const repo = tObj.repo || 'workspace';
      if (tObj.branch && !String(repo).includes(tObj.branch) && !String(repo).includes(':')) {
        return `${repo}:${tObj.branch}`;
      }
      return repo;
    }

    function eventTone(ev) {
      const e = String(ev || '').toLowerCase();
      if (e.includes('complete')) return 'text-emerald-500';
      if (e.includes('stop') || e.includes('fail') || e.includes('error')) return 'text-red-400';
      if (e.includes('shell') || e.includes('command')) return 'text-amber-500';
      if (e.includes('file')) return 'text-zinc-300';
      if (e.includes('sessionstart') || e === 'onstart') return 'text-zinc-400';
      return 'text-zinc-500';
    }

    function stripDetail(detail) {
      return String(detail || '').replace(/^(编辑文件|执行命令|操作文件|调用工具|会话启动，分析任务中\.\.\.|任务执行完成):\s*/, '');
    }

    function actionLine(tObj) {
      const ev = tObj.lastHook || tObj.event || 'event';
      const detail = stripDetail(tObj.detail) || '…';
      return `$ ${ev}: ${detail}`;
    }

    function agentName(tObj) {
      return String(tObj && tObj.agent || '').trim() || 'AI Agent';
    }

    let lastFilterSignature = '';
    function renderAgentFilters() {
      const names = [...new Set([...tasksMap.values()].map(agentName))]
        .sort((a, b) => a.localeCompare(b, 'zh-CN'));
      if (agentFilter !== 'all' && !names.includes(agentFilter)) agentFilter = 'all';
      const signature = names.join('\0') + '|' + agentFilter + '|' + currentLang;
      if (signature === lastFilterSignature) return;
      lastFilterSignature = signature;

      const pill = 'filter-pill h-7 px-2 rounded border border-line text-[11px] font-mono text-zinc-500 hover:text-zinc-300';
      const allLabel = t('filterAll');
      const allBtn = `<button type="button" data-filter="all" aria-pressed="${agentFilter === 'all'}" class="${pill}">${esc(allLabel)}</button>`;
      const agentBtns = names.map((name) => (
        `<button type="button" data-filter="${esc(name)}" aria-pressed="${agentFilter === name}" class="${pill}">${esc(agentSlug(name))}</button>`
      )).join('');
      document.getElementById('agent-filters').innerHTML = allBtn + agentBtns;
    }

    function matchesFilter(tObj) {
      if (agentFilter !== 'all' && agentName(tObj) !== agentFilter) return false;
      if (!query) return true;
      const hay = [tObj.title, tObj.prompt, tObj.repo, tObj.branch, tObj.id, tObj.detail, tObj.agent].join(' ').toLowerCase();
      return hay.includes(query);
    }

    function emptyState(text) {
      return `<div class="border border-dashed border-line bg-card/40 px-3 py-6 text-center font-mono text-[11px] text-zinc-600">${esc(text)}</div>`;
    }

    function cardHTML(tObj) {
      const dur = tObj.status === 'running'
        ? formatDurLong(Date.now() - (tObj.startTime || Date.now()))
        : (tObj.duration || formatDurLong(durationMs(tObj)));
      const failReason = tObj.detail || t('abortedDefault');
      const accent = tObj.status === 'running'
        ? 'border-l-amber-500'
        : tObj.status === 'completed'
          ? 'border-l-emerald-600'
          : 'border-l-red-500';

      const actionBar = tObj.status === 'running' ? `
        <div class="font-mono text-[11px] tabular-nums text-zinc-400 bg-black/40 border border-line px-2 py-1 rounded truncate">
          ${esc(actionLine(tObj))}
        </div>` : '';

      const footer = tObj.status === 'running' ? `
        <div class="flex items-center justify-between font-mono text-[11px] tabular-nums">
          <span class="text-amber-500 live-timer" data-start="${tObj.startTime || Date.now()}">${dur}</span>
          <span class="text-zinc-600 truncate ml-2">${esc(tObj.id)}</span>
        </div>` : tObj.status === 'completed' ? `
        <div class="flex items-center justify-between font-mono text-[11px] tabular-nums">
          <span class="inline-flex items-center gap-1 text-emerald-500">${ICO_CHECK}<span>${esc(dur)}</span></span>
          <span class="text-zinc-600 truncate ml-2">${esc(tObj.id)}</span>
        </div>` : `
        <div class="font-mono text-[11px] text-red-300 bg-[#1c1214] border border-[#3f1d1d] px-2 py-1 rounded mb-2 line-clamp-2">${esc(failReason)}</div>
        <div class="flex items-center justify-between font-mono text-[11px] tabular-nums">
          <span class="text-red-400">${esc(dur)}</span>
          <span class="text-zinc-600 truncate ml-2">${esc(tObj.id)}</span>
        </div>`;

      return `
        <article class="task-card cursor-pointer bg-card border border-line border-l-2 ${accent} p-3 rounded text-[13px]"
          data-task-id="${esc(tObj.id)}" role="button" tabindex="0">
          <div class="flex items-start justify-between gap-2 mb-2">
            ${agentBadge(tObj.agent)}
            <span class="font-mono text-[10px] tabular-nums text-zinc-500 truncate">${esc(repoLabel(tObj))}</span>
          </div>
          <h3 class="text-[13px] leading-snug text-zinc-100 line-clamp-2 mb-2">${esc(tObj.title || tObj.prompt || 'untitled session')}</h3>
          <div class="space-y-2">
            ${actionBar}
            ${footer}
          </div>
        </article>`;
    }

    function render() {
      renderAgentFilters();
      const buckets = { running: [], completed: [], failed: [] };
      Array.from(tasksMap.values())
        .filter(matchesFilter)
        .sort((a, b) => (b.startTime || 0) - (a.startTime || 0))
        .forEach((tObj) => {
          const status = buckets[tObj.status] ? tObj.status : 'failed';
          buckets[status].push(tObj);
        });

      document.getElementById('col-running').innerHTML = buckets.running.length
        ? buckets.running.map(cardHTML).join('')
        : emptyState(t('noRunning'));
      document.getElementById('col-completed').innerHTML = buckets.completed.length
        ? buckets.completed.map(cardHTML).join('')
        : emptyState(t('noCompleted'));
      document.getElementById('col-failed').innerHTML = buckets.failed.length
        ? buckets.failed.map(cardHTML).join('')
        : emptyState(t('noFailed'));

      const all = Array.from(tasksMap.values());
      const runningN = all.filter((tObj) => tObj.status === 'running').length;
      const done = all.filter((tObj) => tObj.status === 'completed');
      const doneMs = done.map(durationMs).filter((n) => n > 0);
      const avg = doneMs.length ? doneMs.reduce((a, b) => a + b, 0) / doneMs.length : 0;

      document.getElementById('stat-running').textContent = runningN;
      document.getElementById('stat-completed').textContent = done.length;
      document.getElementById('stat-avg').textContent = formatDurLong(avg);
      document.getElementById('count-running').textContent = buckets.running.length;
      document.getElementById('count-completed').textContent = buckets.completed.length;
      document.getElementById('count-failed').textContent = buckets.failed.length;

      if (selectedId) refreshDrawer();
    }

    function tickTimers() {
      document.querySelectorAll('.live-timer').forEach((el) => {
        el.textContent = formatDurLong(Date.now() - parseInt(el.dataset.start, 10));
      });
    }

    function openDrawer(id) {
      selectedId = id;
      document.getElementById('drawer').classList.add('open');
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'false');
      refreshDrawer();
    }

    function closeDrawer() {
      selectedId = null;
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('drawer-overlay').classList.remove('open');
      document.getElementById('drawer').setAttribute('aria-hidden', 'true');
    }

    function refreshDrawer() {
      const tObj = tasksMap.get(selectedId);
      if (!tObj) { closeDrawer(); return; }
      document.getElementById('drawer-id').textContent = tObj.id;
      document.getElementById('drawer-agent').innerHTML = agentBadge(tObj.agent);
      document.getElementById('drawer-repo').textContent = repoLabel(tObj);
      document.getElementById('drawer-prompt').textContent = tObj.prompt || tObj.title || t('noPrompt');

      const items = tObj.timeline || [];
      document.getElementById('drawer-timeline').innerHTML = items.length
        ? items.map((it, i) => {
            const last = i === items.length - 1;
            const tone = eventTone(it.event);
            return `
              <li class="relative pl-4 pb-3">
                ${last ? '' : '<span class="absolute left-[3px] top-3 bottom-0 w-px bg-line"></span>'}
                <span class="absolute left-0 top-1.5 w-1.5 h-1.5 rounded-full bg-zinc-600"></span>
                <div class="flex items-baseline gap-2">
                  <span class="font-mono text-[10px] tabular-nums text-zinc-600">${esc(it.time || '--:--:--')}</span>
                  <span class="font-mono text-[11px] ${tone}">${esc(it.event || 'event')}</span>
                </div>
                <p class="mt-0.5 font-mono text-[11px] text-zinc-500 leading-relaxed">${esc(it.desc || '—')}</p>
              </li>`;
          }).join('')
        : `<li class="font-mono text-[11px] text-zinc-600">${esc(t('noTimeline'))}</li>`;

      const statusLabel = tObj.status === 'running' ? t('statusRunning') : tObj.status === 'completed' ? t('statusCompleted') : t('statusFailed');
      const statusCls = tObj.status === 'running' ? 'text-amber-500' : tObj.status === 'completed' ? 'text-emerald-500' : 'text-red-400';
      document.getElementById('drawer-metrics').innerHTML = `
        <div class="bg-panel py-2.5">
          <div class="font-mono text-[10px] uppercase tracking-wide text-zinc-600">${esc(t('drawerDuration'))}</div>
          <div class="mt-0.5 font-mono text-[12px] tabular-nums text-zinc-200">${esc(tObj.duration || formatDurLong(durationMs(tObj)))}</div>
        </div>
        <div class="bg-panel py-2.5">
          <div class="font-mono text-[10px] uppercase tracking-wide text-zinc-600">${esc(t('drawerHooks'))}</div>
          <div class="mt-0.5 font-mono text-[12px] tabular-nums text-zinc-200">${items.length}</div>
        </div>
        <div class="bg-panel py-2.5">
          <div class="font-mono text-[10px] uppercase tracking-wide text-zinc-600">${esc(t('drawerStatus'))}</div>
          <div class="mt-0.5 font-mono text-[12px] ${statusCls}">${statusLabel}</div>
        </div>`;
    }

    function setDaemon(online) {
      isOnline = online;
      const el = document.getElementById('daemon-status');
      el.innerHTML = online
        ? '<span class="w-1.5 h-1.5 rounded-full bg-[#6b8f71]"></span>127.0.0.1:8000'
        : `<span class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span>${esc(t('offline'))}`;
      el.className = 'inline-flex items-center gap-1.5 font-mono text-[11px] tabular-nums ' + (online ? 'text-zinc-500' : 'text-zinc-600');
    }

    function connect() {
      if (eventSource) {
        eventSource.onerror = null;
        eventSource.close();
      }
      eventSource = new EventSource('/api/stream');
      eventSource.onopen = () => setDaemon(true);
      eventSource.onmessage = (e) => {
        try {
          const task = JSON.parse(e.data);
          if (task && task.id) {
            tasksMap.set(task.id, task);
            render();
          }
        } catch (_) { /* ignore malformed frames */ }
      };
      eventSource.onerror = () => {
        setDaemon(false);
        eventSource.close();
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      };
    }

    async function postEvent(body) {
      const res = await fetch('/api/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('event failed');
    }

    function applyLocal(taskPatch) {
      const prev = tasksMap.get(taskPatch.id) || {
        id: taskPatch.id,
        agent: taskPatch.agent,
        repo: taskPatch.repo,
        title: taskPatch.title,
        prompt: taskPatch.prompt,
        status: 'running',
        startTime: Date.now(),
        timeline: [],
      };
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      prev.agent = taskPatch.agent || prev.agent;
      prev.repo = taskPatch.repo || prev.repo;
      if (taskPatch.title) prev.title = taskPatch.title;
      if (taskPatch.prompt && !prev.prompt) prev.prompt = taskPatch.prompt;
      prev.event = taskPatch.event;
      prev.lastHook = taskPatch.event;
      prev.detail = taskPatch.detail;
      prev.status = taskPatch.status || prev.status;
      if (taskPatch.status === 'completed' || taskPatch.status === 'failed') {
        prev.endTime = Date.now();
        prev.duration = formatDurLong(prev.endTime - prev.startTime);
      }
      prev.timeline = (prev.timeline || []).concat([{
        time: `${hh}:${mm}:${ss}`,
        event: taskPatch.event,
        desc: taskPatch.detail,
      }]);
      tasksMap.set(prev.id, prev);
      render();
    }

    async function dispatchMock() {
      const spec = MOCKS[mockSeq % MOCKS.length];
      mockSeq += 1;
      const id = `mock-${Date.now().toString(36)}`;
      const base = {
        id,
        agent: spec.agent,
        repo: spec.repo,
        title: spec.title,
        prompt: spec.prompt,
      };
      const start = { ...base, event: 'sessionStart', detail: 'session start' };
      const mid = { ...base, event: spec.event, detail: spec.detail };
      try {
        await postEvent(start);
        await postEvent(mid);
        if (spec.finish === 'complete') {
          await postEvent({ ...base, event: 'agentCompletion', detail: 'agent completion' });
        } else if (spec.finish === 'fail') {
          await postEvent({ ...base, event: 'stop', detail: 'Aborted by user (SIGINT)' });
        }
      } catch (_) {
        applyLocal({ ...start, status: 'running' });
        applyLocal({ ...mid, status: 'running' });
        if (spec.finish === 'complete') applyLocal({ ...base, event: 'agentCompletion', detail: 'agent completion', status: 'completed' });
        if (spec.finish === 'fail') applyLocal({ ...base, event: 'stop', detail: 'Aborted by user (SIGINT)', status: 'failed' });
      }
    }

    async function clearCompleted() {
      try {
        await fetch('/api/tasks', { method: 'DELETE' });
      } catch (_) { /* local fallback */ }
      for (const [id, tObj] of tasksMap) {
        if (tObj.status !== 'running') tasksMap.delete(id);
      }
      if (selectedId && !tasksMap.has(selectedId)) closeDrawer();
      render();
    }

    function focusSearch() {
      const el = document.getElementById('search-input');
      el.focus();
      el.select();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      query = e.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById('agent-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-filter]');
      if (!btn) return;
      agentFilter = btn.dataset.filter;
      lastFilterSignature = '';
      render();
    });
    document.getElementById('btn-lang').addEventListener('click', toggleLanguage);
    document.getElementById('btn-mock').addEventListener('click', dispatchMock);
    document.getElementById('btn-clear').addEventListener('click', clearCompleted);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        focusSearch();
      }
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        focusSearch();
      }
    });
    document.addEventListener('click', (e) => {
      const card = e.target.closest('[data-task-id]');
      if (card) openDrawer(card.dataset.taskId);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const card = e.target.closest('[data-task-id]');
      if (!card) return;
      e.preventDefault();
      openDrawer(card.dataset.taskId);
    });

    setInterval(tickTimers, 1000);
    applyLanguageUI();
    connect();
  </script>
</body>
</html>
