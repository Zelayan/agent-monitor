name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to publish (e.g. v1.0.0-beta.2)"
        required: true
        default: "v1.0.0-beta.2"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run Tests
        run: |
          go test -v -race ./...

      - name: Build Cross-Platform Binaries
        env:
          CGO_ENABLED: 0
          LDFLAGS: "-s -w"
        run: |
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME}
          
          # Target platforms: OS/ARCH
          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi
            
            BUILD_DIR="dist/agent-monitor_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "${BUILD_DIR}"
            
            # Compile main monitor server
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/agent-monitor${EXT}" main.go
            
            # Compile hook reporter
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/agent-reporter${EXT}" cmd/reporter/main.go
            
            # Copy documentation and config templates
            cp README.md install.sh "${BUILD_DIR}/"
            cp -r configs "${BUILD_DIR}/"
            
            # Archive package
            ARCHIVE_NAME="agent-monitor_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -r "../release-assets/${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME#dist/}")
            else
              tar -czf "release-assets/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME#dist/}"
            fi
          done

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    env:
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USER || secrets.DOCKER_USER || vars.DOCKERHUB_USERNAME || 'zelayan' }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_ACCESS_TOKEN || secrets.DOCKER_TOKEN || vars.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW="$GITHUB_REF_NAME"
          else
            RAW="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          RAW="${RAW#v}"
          if [ -z "$RAW" ]; then
            echo "Could not resolve image version" >&2
            exit 1
          fi
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.HUB_USER }}
          password: ${{ env.HUB_TOKEN }}

      - name: Build and push GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zelayan/agent-monitor:${{ steps.ver.outputs.tag }}
            ghcr.io/zelayan/agent-monitor:${{ steps.ver.outputs.version }}
            ghcr.io/zelayan/agent-monitor:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Docker Hub from GHCR
        run: |
          SRC="ghcr.io/zelayan/agent-monitor:${{ steps.ver.outputs.tag }}"
          docker buildx imagetools inspect "$SRC"
          docker buildx imagetools create \
            --tag "zelayan/agent-monitor:${{ steps.ver.outputs.tag }}" \
            --tag "zelayan/agent-monitor:${{ steps.ver.outputs.version }}" \
            --tag "zelayan/agent-monitor:latest" \
            "$SRC"
